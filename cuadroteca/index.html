<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Digital | Neon Edition</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=neon">
    <style>
        /* MOBILE DENSE GRID (Strictly < 900px) */
        @media (max-width: 900px) {
            .neon-header {
                padding: 0.3rem !important;
                flex-direction: column !important;
                gap: 2px !important;
            }
            .header-center {
                position: static !important;
                transform: none !important;
            }
            .neon-title {
                font-size: 1rem !important;
            }
            .mobile-v { display: inline !important; font-size: 10px; color: #888; margin-left: 5px; }
            .nav-btn {
                font-size: 0.65rem !important;
                margin-right: 0.3rem !important;
                padding: 3px 6px !important;
            }
            .art-grid {
                grid-template-columns: repeat(3, 1fr) !important; /* 3 Columns on mobile */
                gap: 6px !important;
                padding: 5px !important;
            }
            .art-item img {
                height: 90px !important; /* Tiny thumbnails */
            }
            .art-info h3 {
                font-size: 0.6rem !important;
                line-height: 1.1 !important;
                margin-top: 5px !important;
            }
            .art-info p, .art-info .price {
                display: none !important; /* Hide everything else */
            }
        }
    </style>

    <!-- Importamos los datos de la web principal -->
    <script src="../js/data.js?v=111"></script>
    <!-- AUDIO PLAYER -->
    <audio id="bgMusic" loop class="audio-hidden">
        <source src="../assets/music.mp3" type="audio/mpeg">
    </audio>
</head>

<body>

    <div class="app-container">
        <!-- Header / Controls -->
        <header class="neon-header">
            <div class="header-left">
                <a href="../colecciones.html" class="nav-btn">⬅ Volver</a>
                <a href="../index.html" class="nav-btn">🏠 Inicio</a>
            </div>

            <div class="header-center">
                <h1 class="neon-title">GALERÍA <span class="highlight">DIGITAL</span> <span class="mobile-v" style="display:none;">v2.3</span></h1>
            </div>

            <div class="header-right">
                <button id="musicBtn" class="music-btn">🎵 Música</button>
            </div>
        </header>

        <!-- Main Gallery Grid -->
        <main id="gallery-container" class="gallery-container">
            <!-- JS injected content here -->
        </main>

    </div>

    <!-- Hero Overlay for details -->
    <div id="hero-overlay">
        <button id="close-hero" onclick="closeHero()">✕</button>
        <div class="hero-content">
            <div class="hero-image-container">
                <img id="hero-img" src="" alt="">
            </div>
            <div class="hero-details">
                <h2 id="hero-title">Título de la Obra</h2>
                <div class="hero-meta">
                    <span id="hero-category" class="tag">Categoría</span>
                    <span id="hero-price" class="price">Precio</span>
                </div>
                <p id="hero-desc">Descripción detallada de la obra...</p>
                <div style="display: flex; gap: 10px; margin-top:20px;">
                    <!-- Botón de compra -->
                    <button id="btn-comprar-cuadroteca" class="btn-comprar"
                        style="flex: 1; padding:10px 15px; font-weight:bold; cursor:pointer;">🛒 Comprar el
                        Cuadro</button>
                    <!-- Botón de Probador Virtual -->
                    <button id="btn-probador-cuadroteca" class="btn-outline"
                        style="flex: 1; padding:10px 15px; font-weight:bold; cursor:pointer; background: transparent; border: 1px solid #fff; color: #fff;">🖼️
                        Probador Virtual</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/cart.js?v=111"></script>
    <script src="script.js?v=neon"></script>
</body>

</html>
